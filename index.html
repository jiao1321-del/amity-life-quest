<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Amity Quest"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>AMITY LIFE QUEST</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#f7efff;background:#100f19}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#70538d;color:white;font-weight:650}button.secondary{background:#30283f;color:#e6d9ef}button.danger{background:#713b55}button:disabled{opacity:.45}input,select,textarea{width:100%;padding:12px;border-radius:10px;background:#242031;border:1px solid #51445f;color:white}label{display:block;font-size:12px;color:#cbbbdc;margin:9px 0 5px}.app{max-width:520px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 15px) 16px calc(env(safe-area-inset-bottom) + 90px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:12px;letter-spacing:2px;color:#d9b6f1}.title{font-size:25px;font-weight:750;margin:8px 0 14px}.muted{color:#b6a8c5;font-size:13px}.card{background:#211c2c;border:1px solid #3a3048;border-radius:18px;padding:16px;margin:12px 0}.hero{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 15%,#5b3f6c,#211b2d 68%);border-radius:22px;text-align:center}.avatar{font-size:65px;line-height:1.5}.speech{background:#30253d;border-radius:14px;padding:14px;margin:12px 0;line-height:1.7}.gold{color:#efd096}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{min-width:0}.pill{font-size:12px;border-radius:999px;padding:5px 10px;background:#43334f;color:#e8d4f4}.progress{height:9px;border-radius:99px;background:#40364d;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,#9369c2,#e0b9f2)}.task{display:flex;gap:12px;align-items:center}.task-main{flex:1;min-width:0}.task-name{font-weight:650;overflow-wrap:anywhere}.small{font-size:12px}.stack{display:flex;gap:8px;flex-wrap:wrap}.stack button{flex:1}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 10px calc(env(safe-area-inset-bottom) + 9px);background:#181421;border-top:1px solid #3d304c;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;z-index:5}.nav button{padding:8px 2px;background:transparent;color:#afa0bd;font-size:11px}.nav button.active{background:#473352;color:white}.nav span{display:block;font-size:20px;margin-bottom:3px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:#211a2b;border-radius:22px 22px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 22px);width:min(520px,100%);max-height:90dvh;overflow:auto}.sheet h3{margin:0 0 10px}.day{border-radius:9px;padding:9px 2px;text-align:center;background:#2a2335;font-size:12px}.day.rest{background:#31524c}.day.work{background:#3f3147}.day.off{background:#514128}.notice{font-size:12px;color:#c7b5d3;line-height:1.6}hr{border:0;border-top:1px solid #3c324a;margin:18px 0}
</style></head><body><div class="app"><header><div class="brand">✦ AMITY · LIFE QUEST</div><button class="secondary" id="settingsBtn" aria-label="設定">⚙</button></header><main id="main"></main></div><nav class="nav" id="nav"></nav><div id="modal" class="overlay hidden"><div class="sheet" id="sheet"></div></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()), dateAt=s=>new Date(s+'T12:00:00+08:00'), diff=(a,b)=>Math.round((dateAt(a)-dateAt(b))/86400000), uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
let db, state={tab:'home',tasks:[],events:[],days:{},profile:{nickname:'冒險者',anchor:'2026-11-14',challenge:today()},moods:[],amity:[]};
const names={strength:'力量',endurance:'耐力',wisdom:'智慧',focus:'專注',discipline:'自律'}, tabs=[['home','⌂','首頁'],['quest','☷','任務'],['hero','✧','角色'],['talk','♡','互動'],['record','▦','紀錄']];
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('amity-life-quest',1);r.onupgradeneeded=()=>r.result.createObjectStore('app');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readDB(){return new Promise((resolve,reject)=>{let r=db.transaction('app').objectStore('app').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function save(){return new Promise((resolve,reject)=>{let r=db.transaction('app','readwrite').objectStore('app').put(state,'state');r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function typeOfDay(d){if(state.days[d])return state.days[d];let n=((diff(d,state.profile.anchor)%4)+4)%4;return n<2?'off':'work'}
function applies(t,d){if(t.archived||d<t.start||t.end&&d>t.end)return false;if(typeOfDay(d)==='rest')return false;if(t.applies!=='all'&&t.applies!==typeOfDay(d))return false;if(t.frequency==='once')return d===t.start;if(t.frequency==='weekly')return (t.weekdays||[]).includes(dateAt(d).getUTCDay());return true}
function tasksOn(d){return state.tasks.filter(t=>applies(t,d))}
function eventFor(id,d){return state.events.find(e=>e.taskId===id&&e.date===d&&e.active)}
function calc(){let earned={},stats=Object.fromEntries(Object.keys(names).map(k=>[k,0]));let events=state.events.filter(e=>e.active).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);let xp=0;for(const e of events){let cap=earned[e.date]||{xp:0,stat:0};let award=Math.min(e.xp,Math.max(0,300-cap.xp));let pts=Math.min(e.points,Math.max(0,12-cap.stat));cap.xp+=award;cap.stat+=pts;earned[e.date]=cap;xp+=award;stats[e.attribute]=(stats[e.attribute]||0)+pts}let level=1,remain=xp;while(remain>=100+50*(level-1)){remain-=100+50*(level-1);level++}return {xp,level,remain,need:100+50*(level-1),stats,earned}}
function message(){let d=today(),t=tasksOn(d),completed=t.filter(x=>eventFor(x.id,d)).length;if(typeOfDay(d)==='rest')return '今天就安心休息吧。休息也是冒險的一部分。♡';if(t.length&&completed===t.length)return '任務全完成了？哼，看來今天值得好好稱讚你。♡';if(completed)return '有前進就很棒了。記得也要照顧自己。';let h=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Taipei',hour:'2-digit',hour12:false}).format(new Date()));return h<12?'早安。今天想從哪件小事開始？':h<18?'下午好，來看看今天的小目標吧。':'歡迎回家。先喝口水，再慢慢來。♡'}
function render(){let c=calc(),d=today(),tt=tasksOn(d),completed=tt.filter(t=>eventFor(t.id,d)).length;$('#nav').innerHTML=tabs.map(([id,icon,name])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><span>${icon}</span>${name}</button>`).join('');let body='';
if(state.tab==='home')body=`<div class="row"><div class="title">歡迎回家 ♡</div><b class="gold">LV ${c.level}</b></div><div class="hero"><div class="avatar">♡</div><b>Amity</b><div class="muted">寫實角色立繪預留位置</div></div><div class="speech">${esc(message())}</div><div class="card"><div class="row"><b>今日任務</b><span class="gold">${completed} / ${tt.length}</span></div><div class="progress"><div class="fill" style="width:${tt.length?completed/tt.length*100:0}%"></div></div><div class="row"><span class="muted">${{off:'休假日',work:'上班日',rest:'完全休息'}[typeOfDay(d)]}</span><button class="secondary" data-action="day">調整日型</button></div></div><div class="stack"><button data-tab="quest">查看任務</button><button class="secondary" data-tab="talk">與 Amity 互動</button></div>`;
if(state.tab==='quest')body=`<div class="row"><div class="title">任務公會</div><button data-action="new">＋ 新增</button></div><div class="muted">今日 ${d} · ${completed}/${tt.length} 已完成</div>${tt.length?tt.map(t=>taskCard(t,d)).join(''):'<div class="card muted">今天沒有排定任務。可以新增一個小目標，或安心休息。</div>'}<hr><div class="row"><b>任務管理</b><span class="muted">${state.tasks.length} 項</span></div>${state.tasks.map(t=>`<div class="card row"><div><b>${esc(t.name)}</b><div class="muted">${t.archived?'已封存':esc(t.frequency)} · ${esc(names[t.attribute])}</div></div><button class="secondary" data-edit="${t.id}">編輯</button></div>`).join('')}`;
if(state.tab==='hero')body=`<div class="title">冒險者檔案</div><div class="card"><div class="row"><b class="gold" style="font-size:32px">LV ${c.level}</b><span class="pill">初心冒險者</span></div><div class="muted">升級進度 ${c.remain} / ${c.need} XP · 累積 ${c.xp} XP</div><div class="progress"><div class="fill" style="width:${c.remain/c.need*100}%"></div></div></div>${Object.entries(names).map(([k,n])=>`<div class="card row"><b>${n}</b><span class="gold">${10+Math.floor(c.stats[k]/10)} <small class="muted">(${c.stats[k]%10}/10)</small></span></div>`).join('')}<p class="notice">屬性初始 10，每累積 10 成長點提升 1 級。當日最多獲得 300 XP 和 12 成長點。</p>`;
if(state.tab==='talk')body=`<div class="title">Amity 的日常</div><div class="hero" style="min-height:180px"><div class="avatar">♡</div><div class="muted">Amity 表情立繪預留位置</div></div><div class="speech" id="amityLine">${esc(state.amity.at(-1)?.text||message())}</div><div class="grid">${[['chat','聊聊天'],['mood','分享心情'],['encourage','鼓勵我'],['night','晚安']].map(([id,label])=>`<button class="secondary" data-talk="${id}">${label}</button>`).join('')}</div><p class="notice">目前為本機情境台詞，不是 AI 自由聊天。</p>`;
if(state.tab==='record'){let start=state.profile.challenge,day=diff(d,start)+1;let dates=Array.from({length:14},(_,i)=>{let x=new Date(dateAt(d).getTime()-(13-i)*86400000);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(x)});body=`<div class="title">生活紀錄</div><div class="card row"><div><div class="muted">66 天挑戰</div><b class="gold" style="font-size:26px">${day<1?'尚未開始':day>66?'已滿 66 天':'DAY '+day+' / 66'}</b></div><div><div class="muted">累積 XP</div><b>${c.xp}</b></div></div><div class="card"><b>最近 14 天</b><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px">${dates.map(x=>{let a=tasksOn(x),n=a.filter(t=>eventFor(t.id,x)).length;return `<div class="day ${typeOfDay(x)}" title="${x}">${x.slice(-2)}<div>${typeOfDay(x)==='rest'?'休':a.length?n+'/'+a.length:'—'}</div></div>`}).join('')}</div></div><div class="card"><label>查看日期</label><input id="recordDate" type="date" max="${d}" value="${d}"><div id="recordDetail" class="notice" style="margin-top:12px"></div></div><button class="secondary" data-action="settings">資料備份與設定</button>`}
$('#main').innerHTML=body;if(state.tab==='record')showRecord(d)}
function taskCard(t,d){let e=eventFor(t.id,d);return `<div class="card task"><div class="task-main"><div class="task-name">${esc(t.name)}</div><div class="muted">${esc(t.target)} ${esc(t.unit)} · ${esc(names[t.attribute])} · ${t.xp} XP</div></div><button class="${e?'secondary':''}" data-complete="${t.id}">${e?'撤銷':'完成'}</button></div>`}
function showRecord(d){let t=tasksOn(d),n=t.filter(x=>eventFor(x.id,d)).length;$('#recordDetail').textContent=`${d}｜${{off:'休假',work:'上班',rest:'完全休息'}[typeOfDay(d)]}｜任務 ${n}/${t.length} 完成｜${state.moods.filter(m=>m.date===d).at(-1)?.value||'無心情紀錄'}`}
function modal(content){$('#sheet').innerHTML=content;$('#modal').classList.remove('hidden')}function close(){ $('#modal').classList.add('hidden')}
function form(t){let edit=!!t;t=t||{name:'',attribute:'discipline',frequency:'daily',weekdays:[1,2,3,4,5,6,0],target:1,unit:'次',difficulty:'easy',applies:'all',start:today(),end:'',archived:false};modal(`<h3>${edit?'編輯任務':'新增任務'}</h3><form id="taskForm"><label>任務名稱</label><input name="name" maxlength="40" required value="${esc(t.name)}"><label>主要屬性</label><select name="attribute">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${t.attribute===k?'selected':''}>${v}</option>`).join('')}</select><label>頻率</label><select name="frequency">${[['daily','每日'],['weekly','每週指定日'],['once','單次']].map(([k,v])=>`<option value="${k}" ${t.frequency===k?'selected':''}>${v}</option>`).join('')}</select><label>指定星期（每週任務適用，0=週日；例如 1,3,5）</label><input name="weekdays" value="${esc((t.weekdays||[]).join(','))}"><div class="grid"><div><label>目標數值</label><input name="target" type="number" min="0.01" step="any" required value="${t.target}"></div><div><label>單位</label><input name="unit" maxlength="12" required value="${esc(t.unit)}"></div></div><label>難度</label><select name="difficulty">${[['easy','簡單 · 20 XP'],['normal','普通 · 40 XP'],['hard','困難 · 80 XP']].map(([k,v])=>`<option value="${k}" ${t.difficulty===k?'selected':''}>${v}</option>`).join('')}</select><label>適用日</label><select name="applies">${[['all','全部'],['work','上班日'],['off','休假日']].map(([k,v])=>`<option value="${k}" ${t.applies===k?'selected':''}>${v}</option>`).join('')}</select><div class="grid"><div><label>開始日期</label><input name="start" type="date" required value="${t.start}"></div><div><label>結束日期（可空白）</label><input name="end" type="date" value="${t.end||''}"></div></div><div class="stack" style="margin-top:15px"><button type="submit">儲存</button><button type="button" class="secondary" data-close>取消</button></div>${edit?`<div class="stack" style="margin-top:12px"><button type="button" class="secondary" data-archive="${t.id}">${t.archived?'重新啟用':'封存'}</button><button type="button" class="danger" data-delete="${t.id}">刪除</button></div>`:''}</form>`);$('#taskForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f),weekdays=[...new Set(v.weekdays.split(',').map(s=>Number(s.trim())).filter(x=>Number.isInteger(x)&&x>=0&&x<=6))];if(v.frequency==='weekly'&&!weekdays.length)return alert('每週任務請至少指定一天（0～6）');if(v.end&&v.end<v.start)return alert('結束日期不得早於開始日期');let obj={...t,...v,weekdays,target:Number(v.target),xp:{easy:20,normal:40,hard:80}[v.difficulty],points:{easy:1,normal:2,hard:3}[v.difficulty],id:t.id||uid()};if(edit)state.tasks=state.tasks.map(x=>x.id===t.id?obj:x);else state.tasks.push(obj);await save();close();render()}}
function settings(){modal(`<h3>設定與資料</h3><label>玩家暱稱</label><input id="nickname" maxlength="30" value="${esc(state.profile.nickname)}"><label>做二休二：休假第一天的基準日期</label><input id="anchor" type="date" value="${state.profile.anchor}"><label>66 天挑戰開始日期</label><input id="challenge" type="date" value="${state.profile.challenge}"><p class="notice">使用台灣時區；可以手動調整個別日期的日型。資料只保存在目前裝置與網站來源。</p><div class="stack"><button id="saveSettings">儲存設定</button><button class="secondary" data-close>關閉</button></div><hr><div class="stack"><button id="export">匯出 JSON 備份</button><button class="secondary" id="importBtn">匯入備份</button></div><input class="hidden" type="file" accept=".json,application/json" id="importFile"><p class="notice">備份可能包含生活紀錄及心情，請妥善保存。清除 Safari 網站資料可能使本機紀錄消失。</p>`);$('#saveSettings').onclick=async()=>{state.profile={nickname:$('#nickname').value.trim()||'冒險者',anchor:$('#anchor').value,challenge:$('#challenge').value};await save();close();render()};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'amity-life-quest',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='amity-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>5e6)throw Error('備份檔過大');let data=JSON.parse(await f.text());if(data.format!=='amity-life-quest'||data.version!==1||!data.state||!Array.isArray(data.state.tasks)||!Array.isArray(data.state.events)||!data.state.profile||typeof data.state.days!=='object'||!Array.isArray(data.state.moods)||!Array.isArray(data.state.amity))throw Error('檔案格式或版本不支援');if(!confirm(`備份時間：${data.exportedAt||'未知'}\n任務：${data.state.tasks.length} 項\n完成事件：${data.state.events.length} 筆\n確定覆蓋目前資料？`))return;state={...data.state,tab:'home'};await save();close();render();alert('還原完成')}catch(err){alert('無法匯入：'+err.message)}}}
function dayModal(){let d=today();modal(`<h3>調整今日模式</h3><p class="muted">${d} · 預設依做二休二循環推算</p><div class="stack">${[['work','上班日'],['off','休假日'],['rest','完全休息']].map(([k,n])=>`<button class="secondary" data-day="${k}">${n}</button>`).join('')}</div><p class="notice">休息日不產生任務、不扣經驗，也不會被計入完成率分母。</p><button class="secondary" data-day="auto">恢復自動班表</button><button class="secondary" data-close>關閉</button>`)}
function talk(id){if(id==='mood'){modal(`<h3>今天的心情</h3><div class="stack">${['開心','普通','疲倦','低落'].map(v=>`<button class="secondary" data-mood="${v}">${v}</button>`).join('')}</div><button class="secondary" data-close>取消</button>`);return}let lines={chat:['我在呀。今天有什麼新鮮事？','說來聽聽，我今天有空陪你。'],encourage:['不必一次做到完美，今天前進一點就好。♡','你已經在努力了，我有看見。'],night:['晚安。今天辛苦了，睡個好覺。','把手機放下吧，明天再繼續冒險。♡']};let opts=lines[id]||lines.chat,prev=state.amity.at(-1)?.text,line=opts.find(x=>x!==prev)||opts[0];state.amity.push({id:uid(),date:today(),text:line,kind:id});save().then(render)}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;render()}else if(b.id==='settingsBtn'||b.dataset.action==='settings')settings();else if(b.dataset.action==='new')form();else if(b.dataset.action==='day')dayModal();else if(b.dataset.close!==undefined)close();else if(b.dataset.edit)form(state.tasks.find(t=>t.id===b.dataset.edit));else if(b.dataset.complete){let id=b.dataset.complete,d=today(),existing=eventFor(id,d);if(existing){existing.active=false}else{let t=state.tasks.find(x=>x.id===id);state.events.push({id:uid(),taskId:id,date:d,active:true,created:Date.now(),xp:t.xp,points:t.points,attribute:t.attribute,name:t.name})}await save();render()}else if(b.dataset.archive){let t=state.tasks.find(x=>x.id===b.dataset.archive);t.archived=!t.archived;await save();close();render()}else if(b.dataset.delete){if(!confirm('刪除任務？歷史獎勵仍會保留。'))return;state.tasks=state.tasks.filter(x=>x.id!==b.dataset.delete);await save();close();render()}else if(b.dataset.day){if(b.dataset.day==='auto')delete state.days[today()];else state.days[today()]=b.dataset.day;await save();close();render()}else if(b.dataset.talk)talk(b.dataset.talk);else if(b.dataset.mood){state.moods.push({date:today(),value:b.dataset.mood});state.amity.push({id:uid(),date:today(),kind:'mood',text:b.dataset.mood==='疲倦'||b.dataset.mood==='低落'?'今天就對自己溫柔一點，我陪你。♡':'聽你這麼說，我也跟著開心了。♡'});await save();close();render()}});
document.addEventListener('change',e=>{if(e.target.id==='recordDate')showRecord(e.target.value)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
(async()=>{try{db=await openDB();let saved=await readDB();if(saved)state={...state,...saved,tab:'home'};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#main').innerHTML='<div class="card">無法啟動本機儲存。請使用 Safari 的 HTTPS 網址開啟，避免無痕模式。<p>'+esc(e.message)+'</p></div>'}})();
</script></body></html>
